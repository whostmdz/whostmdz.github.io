/** Banque de questions : filtres, recherche et édition. */
function questionListRow(question, position) {
  const progress = db.progress[question.id];
  const status = progress?.attempts
    ? `${pct(progress.correct, progress.attempts)} % de réussite sur ${countText(progress.attempts, 'tentative')}`
    : 'Pas encore révisée';
  const subject = getSubject(question.subjectId);
  const chapter = getChapter(question.subjectId, question.chapterId);
  return `<article class="question-row">
    <div class="q-text"><h2>${esc(question.prompt)}</h2>
      <p class="question-location">${esc(subject?.name)} / ${esc(chapter?.name)}</p>
      <div class="question-meta"><span>${question.type === 'multiple' ? 'Réponses multiples' : 'Réponse unique'}</span>
        <span>${countText(question.options.length, 'proposition')}</span><span>${status}</span></div>
    </div>
    <div class="question-actions">
      <button class="btn compact" data-action="edit-question" data-id="${esc(question.id)}"
        aria-label="Modifier la question ${position}">Modifier</button>
      <button class="icon-btn danger-text" data-action="delete-question" data-id="${esc(question.id)}"
        aria-label="Supprimer la question ${position}">${icon('trash')}</button>
    </div>
  </article>`;
}

function renderLibrary() {
  if (ui.subject && !getSubject(ui.subject)) { ui.subject = ''; ui.chapter = ''; }
  const search = ui.search.toLocaleLowerCase('fr');
  const questions = questionsFor(ui.subject, ui.chapter).filter(question =>
    [question.prompt, question.explanation, ...question.options.map(option => option.text)]
      .join(' ').toLocaleLowerCase('fr').includes(search));
  const maximumPage = Math.max(0, Math.ceil(questions.length / QUESTIONS_PER_PAGE) - 1);
  ui.pageIndex = Math.min(ui.pageIndex, maximumPage);
  const start = ui.pageIndex * QUESTIONS_PER_PAGE;
  const rows = questions.slice(start, start + QUESTIONS_PER_PAGE)
    .map((question, index) => questionListRow(question, start + index + 1)).join('');
  const pagination = questions.length > QUESTIONS_PER_PAGE ? `
    <div class="pagination"><span>${start + 1}–${Math.min(start + QUESTIONS_PER_PAGE, questions.length)} sur ${questions.length}</span>
      <div class="row"><button class="btn compact" data-action="page-prev" ${ui.pageIndex ? '' : 'disabled'}>Précédent</button>
        <span>${ui.pageIndex + 1} / ${maximumPage + 1}</span>
        <button class="btn compact" data-action="page-next" ${ui.pageIndex === maximumPage ? 'disabled' : ''}>Suivant</button></div>
    </div>` : '';
  return title('Questions', 'Consultez, corrigez et complétez votre banque de QCM.',
    '<button class="btn" data-action="navigate" data-page="data">Importer</button>' +
    '<button class="btn primary" data-action="new-question">Nouvelle question</button>') + `
    <div class="filters">
      <div class="field"><label for="library-subject">Matière</label><select id="library-subject">${subjectOptions(ui.subject)}</select></div>
      <div class="field"><label for="library-chapter">Chapitre</label><select id="library-chapter">${chapterOptions(ui.subject, ui.chapter)}</select></div>
      <div class="field search-field"><label for="search">Rechercher</label><input type="search" id="search"
        placeholder="Énoncé, proposition ou explication" value="${esc(ui.search)}"></div>
    </div>
    <p class="list-count">${countText(questions.length, 'question')}</p>
    <section class="question-list">${rows || empty('Aucune question trouvée', 'Modifiez les filtres ou ajoutez une question.')}</section>
    ${pagination}`;
}


// ── views-session.js ──
/** Préparation, question en cours et bilan d'une session. Aucun score n'est calculé dans ces vues. */
function renderPrepare() {
  const pool = questionsFor(ui.prepSubject, ui.prepChapter);
  const available = ui.mode === 'errors' ? pool.filter(isWeakQuestion).length : pool.length;
  const modes = [
    {id: 'classic', label: 'Classique', help: 'Sans limite de temps.'},
    {id: 'exam', label: 'Examen', help: 'Avec un chronomètre.'},
    {id: 'errors', label: 'Erreurs', help: 'Questions à retravailler.'}
  ];
  const buttons = modes.map(mode => `<button class="mode-tab ${ui.mode === mode.id ? 'active' : ''}"
    data-action="mode" data-mode="${mode.id}" aria-pressed="${ui.mode === mode.id}">
    <strong>${mode.label}</strong><span>${mode.help}</span></button>`).join('');
  const duration = ui.mode === 'exam' ? `<div class="field">
    <label for="prep-minutes">Durée en minutes</label>
    <input id="prep-minutes" type="number" min="1" max="180" value="${ui.minutes}" required>
    <p class="help">Le temps continue pendant les corrections et si vous quittez la page.</p>
  </div>` : '';
  const unavailable = ui.mode === 'errors' && !available
    ? '<p class="notice">Aucune erreur à retravailler dans cette sélection. Choisissez le mode classique pour continuer.</p>' : '';
  return title('Préparer une révision', 'Choisissez le contenu, puis le mode de la session.') +
    resumeBanner() + `<div class="mode-tabs" aria-label="Mode de révision">${buttons}</div>
    <div class="prepare-layout"><section class="panel">
      <form id="prepare-form" class="stack">
        <div class="form-grid"><div class="field"><label for="prep-subject">Matière</label>
          <select id="prep-subject">${subjectOptions(ui.prepSubject)}</select></div>
          <div class="field"><label for="prep-chapter">Chapitre</label>
          <select id="prep-chapter">${chapterOptions(ui.prepSubject, ui.prepChapter)}</select></div></div>
        <div class="form-grid"><div class="field"><label for="prep-count">Nombre de questions</label>
          <input id="prep-count" type="number" min="1" max="${MAX_SESSION_QUESTIONS}" value="${ui.count}" required>
          <p class="help">De 1 à ${MAX_SESSION_QUESTIONS}, dans la limite du contenu disponible.</p></div>${duration}</div>
        <p class="availability"><strong>${countText(available, 'question')} disponible${available === 1 ? '' : 's'}</strong></p>
        ${unavailable}<div><button class="btn primary" type="submit" ${available ? '' : 'disabled'}>Commencer la session</button></div>
      </form>
    </section><aside class="revision-rules">
      <h2>Règles de la session</h2>
      <ul><li>La correction apparaît après chaque validation.</li>
        <li>Pour une réponse multiple, cochez toutes les bonnes propositions et aucune mauvaise.</li>
        <li>Une erreur redevient prioritaire. Les réussites successives espacent les rappels.</li>
        <li>Chaque question apparaît une fois par session.</li></ul>
      <p class="muted">Vous pouvez reprendre une session enregistrée dans ce navigateur.</p>
    </aside></div>`;
}

function answerButton(question, option, index, session, answered) {
  const selected = session.selected.includes(option.id);
  let state = selected ? 'selected' : '';
  if (answered) state = option.correct ? 'correct' : selected ? 'incorrect' : '';
  let result = '';
  if (answered && option.correct) result = '<span class="answer-result">Bonne réponse</span>';
  else if (answered && selected) result = '<span class="answer-result">Votre choix</span>';
  return `<button class="answer ${state}" data-action="answer-option" data-id="${esc(option.id)}"
    aria-pressed="${selected}" ${answered ? 'disabled' : ''}>
    <span class="answer-selector ${question.type === 'multiple' ? 'square' : ''}">${selected ? icon('check') : ''}</span>
    <span class="answer-label">${esc(option.text)}</span>${result}
    <span class="answer-key" aria-hidden="true">${index + 1}</span>
  </button>`;
}

function correctionBlock(question, answer) {
  const correctAnswers = question.options.filter(option => option.correct).map(option => esc(option.text)).join(' · ');
  const correction = !answer.correct ? `<p><strong>Réponse attendue :</strong> ${correctAnswers}</p>` : '';
  const review = answer.correct
    ? 'L’intervalle avant la prochaine révision dépend de vos réussites consécutives.'
    : 'Cette question redevient à revoir dans 10 minutes et sera favorisée dans vos prochaines sessions.';
  return `<section class="correction ${answer.correct ? '' : 'wrong'}" role="status">
    <h2>${answer.correct ? 'Réponse correcte' : 'Réponse incorrecte'}</h2>${correction}
    <p class="explanation">${esc(question.explanation)}</p><p class="help">${review}</p>
  </section>`;
}

function renderQuiz() {
  const session = db.activeSession;
  if (!session) { ui.page = 'revise'; return renderPrepare(); }
  const question = session.questions[session.currentIndex];
  const answer = session.answers[session.currentIndex];
  const answered = Boolean(answer);
  const timer = session.mode === 'exam' ? `<div id="timer" class="timer" role="timer" aria-label="Temps restant">
    ${icon('clock')}<span>${formatTime(session.deadline - Date.now())}</span></div>` : '';
  const options = question.options.map((option, index) =>
    answerButton(question, option, index, session, answered)).join('');
  const action = answered
    ? `<button class="btn primary" data-action="next-question">${session.currentIndex === session.questions.length - 1 ? 'Voir les résultats' : 'Question suivante'}</button>`
    : `<button class="btn primary" data-action="validate-answer" ${session.selected.length ? '' : 'disabled'}>Valider ma réponse</button>`;
  return `<div class="quiz-shell">
    <div class="quiz-top"><button class="btn" data-action="pause">Enregistrer et quitter</button>
      <span class="muted">${modeName(session.mode)}</span>${timer}</div>
    <div class="quiz-position"><span>Question ${session.currentIndex + 1} sur ${session.questions.length}</span>
      <span>${session.answers.filter(item => item.correct).length} réponse${session.answers.filter(item => item.correct).length > 1 ? 's' : ''} correcte${session.answers.filter(item => item.correct).length > 1 ? 's' : ''}</span></div>
    <div class="progress-track"><i style="width:${session.answers.length / session.questions.length * 100}%"></i></div>
    <section class="quiz-card">
      <p class="question-location">${esc(question.subjectName)} / ${esc(question.chapterName)}</p>
      <h1 id="question-heading">${esc(question.prompt)}</h1>
      <p class="quiz-instruction">${question.type === 'multiple' ? 'Plusieurs réponses attendues.' : 'Une seule réponse attendue.'}</p>
      <div class="answers" role="group" aria-labelledby="question-heading">${options}</div>
      ${answered ? correctionBlock(question, answer) : ''}
      <div class="quiz-bottom"><p class="keyboard muted">Touches 1 à ${question.options.length} : choisir · Entrée : ${answered ? 'continuer' : 'valider'}</p>${action}</div>
    </section>
  </div>`;
}

function reviewedAnswer(item, index) {
  const selected = item.options.filter(option => item.selected.includes(option.id)).map(option => esc(option.text)).join(' · ');
  const correct = item.options.filter(option => option.correct).map(option => esc(option.text)).join(' · ');
  return `<details class="review-item ${item.correct ? '' : 'wrong'}">
    <summary><span class="review-status">${item.correct ? 'Juste' : 'Erreur'}</span><span>${index + 1}. ${esc(item.prompt)}</span></summary>
    <div class="review-body"><p><strong>Votre réponse :</strong> ${selected}</p>
      <p><strong>Réponse attendue :</strong> ${correct}</p><p class="explanation">${esc(item.explanation)}</p></div>
  </details>`;
}

function renderResult() {
  const session = db.sessions.find(item => item.id === ui.resultId) || db.sessions.at(-1);
  if (!session) return empty('Aucun résultat', 'Commencez une session de révision.');
  const rate = pct(session.correct, session.total);
  const missing = session.total - session.answered;
  const status = {completed: 'Terminée', expired: 'Temps écoulé', abandoned: 'Interrompue'}[session.status];
  const unanswered = (session.unanswered || []).map(item => `<details class="review-item">
    <summary><span class="review-status">Non répondue</span><span>${esc(item.prompt)}</span></summary>
    <div class="review-body"><p><strong>Réponse attendue :</strong>
      ${item.options.filter(option => option.correct).map(option => esc(option.text)).join(' · ')}</p>
      <p class="explanation">${esc(item.explanation)}</p></div></details>`).join('');
  return title('Résultats de la session', `${modeName(session.mode)} · ${esc(fmtDate(session.endedAt))} · ${status}`) + `
    <section class="panel result-summary"><div><span class="result-score">${rate} %</span><p>de réussite</p></div>
      <dl><div><dt>Réponses correctes</dt><dd>${session.correct} / ${session.total}</dd></div>
        <div><dt>Erreurs</dt><dd>${session.answered - session.correct}</dd></div>
        <div><dt>Sans réponse validée</dt><dd>${missing}</dd></div>
        <div><dt>Durée</dt><dd>${formatTime(session.durationMs)}</dd></div></dl>
    </section>
    <p class="muted result-note">${esc(session.subjectName)} / ${esc(session.chapterName)}.
      ${missing ? 'Le score inclut les questions non répondues ; leur planification n’a pas été modifiée.' : ''}</p>
    <div class="row wrap section-footer"><button class="btn primary" data-action="navigate" data-page="revise">Nouvelle session</button>
      <button class="btn" data-action="navigate" data-page="progress">Voir ma progression</button>
      ${session.items.some(item => !item.correct) ? '<button class="btn" data-action="quick-errors">Réviser mes erreurs</button>' : ''}</div>
    <section class="panel review-panel"><h2>Détail des réponses</h2>
      ${session.items.map(reviewedAnswer).join('')}${unanswered}</section>`;
}


// ── views-progress.js ──
/** Progression par matière et par chapitre, activité et historique. */
function sessionRow(session) {
  const status = session.status === 'expired' ? ' · Temps écoulé' : session.status === 'abandoned' ? ' · Interrompue' : '';
  return `<div class="session-row"><div><strong>${esc(session.subjectName)}</strong>
    <p>${modeName(session.mode)} · ${fmtDate(session.endedAt)}${status}</p></div>
    <span class="session-score">${session.correct} / ${session.total}</span>
    <button class="btn compact" data-action="session-detail" data-id="${esc(session.id)}"
      aria-label="Détail de la session du ${esc(fmtDate(session.endedAt))}">Détail</button></div>`;
}

function progressTable(subject) {
  const rows = subject.chapters.map(chapter => {
    const questions = questionsFor(subject.id, chapter.id);
    const stats = totals(questions);
    return `<tr><td>${esc(chapter.name)}</td><td>${stats.studied} / ${questions.length}</td>
      <td>${stats.attempts ? stats.rate + ' %' : '—'}</td><td>${stats.mastered} / ${questions.length}</td><td>${stats.due}</td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead><tr><th>Chapitre</th><th>Questions vues</th><th>Réussite</th><th>Maîtrisées</th><th>À revoir</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function activityChart() {
  const answers = allAnswers();
  const days = Array.from({length: 14}, (_, index) => {
    const date = new Date(); date.setDate(date.getDate() - 13 + index);
    return {date, count: answers.filter(answer => dateKey(answer.answeredAt) === dateKey(date)).length};
  });
  const maximum = Math.max(1, ...days.map(day => day.count));
  const description = days.map(day => `${day.date.toLocaleDateString('fr-FR')} : ${day.count} réponses`).join('; ');
  const columns = days.map(day => `<div class="activity-day" title="${day.date.toLocaleDateString('fr-FR')} : ${day.count}">
    <span>${day.count || ''}</span><i style="height:${Math.max(3, day.count / maximum * 85)}px"></i>
    <span>${day.date.getDate()}</span></div>`).join('');
  return `<div class="activity-chart" role="img" aria-label="${esc(description)}">${columns}</div>`;
}

function renderProgress() {
  const stats = totals();
  const weak = weakChapters();
  const limit = ui.historyLimit || 30;
  const subjects = db.subjects.map((subject, index) => {
    const subjectStats = totals(questionsFor(subject.id));
    return `<details class="course-group" ${index ? '' : 'open'}><summary>
      <div><h2>${esc(subject.name)}</h2><p>${subjectStats.attempts ? subjectStats.rate + ' % de réussite' : 'Pas encore révisée'}</p></div>
      <span class="disclosure" aria-hidden="true">⌄</span></summary>${progressTable(subject)}</details>`;
  }).join('');
  const weakRows = weak.map(item => `<div class="weak-item"><div><strong>${esc(item.c.name)}</strong>
    <p>${esc(item.s.name)} · ${item.t.rate} % sur ${countText(item.t.attempts, 'tentative')}</p></div>
    <button class="btn compact" data-action="revise-chapter" data-subject="${esc(item.s.id)}"
      data-chapter="${esc(item.c.id)}">Réviser</button></div>`).join('');
  return title('Progression', 'Suivez vos réponses et identifiez les chapitres à retravailler.') + `
    <div class="course-summary"><span><strong>${stats.studied}</strong> question${stats.studied === 1 ? '' : 's'} vue${stats.studied === 1 ? '' : 's'}</span>
      <span><strong>${stats.attempts ? stats.rate + ' %' : '—'}</strong> de réussite</span>
      <span><strong>${stats.mastered}</strong> maîtrisées</span><span><strong>${db.sessions.length}</strong> session${db.sessions.length === 1 ? '' : 's'}</span></div>
    <section class="panel"><h2>Réponses sur les 14 derniers jours</h2>${activityChart()}</section>
    <section class="section-block"><h2>Par matière et chapitre</h2>
      <p class="muted">Réussite : réponses justes / tentatives. Maîtrise : au moins ${MASTERY_STREAK} réussites consécutives.</p>
      <div class="course-groups">${subjects || empty('Aucune matière', 'Ajoutez des cours pour commencer.')}</div></section>
    <section class="panel section-block"><h2>Points faibles</h2>
      ${weakRows || '<p class="muted">Les chapitres avec des tentatives et moins de 80 % de réussite apparaîtront ici.</p>'}</section>
    <section class="panel section-block"><h2>Historique des sessions</h2>
      ${db.sessions.length ? db.sessions.slice(-limit).reverse().map(sessionRow).join('') : '<p class="muted">Aucune session enregistrée.</p>'}
      ${db.sessions.length > limit ? '<button class="btn" data-action="history-more">Afficher les sessions précédentes</button>' : ''}</section>`;
}

// ── events.js ──
/** Événements : clics, formulaires et raccourcis clavier. */

document.addEventListener('click', async e => {
  const button = e.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const {
    action,
    id,
    subject,
    chapter
  } = button.dataset;
  try {
    switch (action) {
      case 'history-more':
        ui.historyLimit = (ui.historyLimit || 30) + 30; render();
        break;
      case 'navigate':
        navigate(button.dataset.page);
        break;
      case 'theme':
        db.settings.theme = db.settings.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        save();
        break;
      case 'reload':
        location.reload();
        break;
      case 'new-subject':
        nameDialog('new-subject');
        break;
      case 'rename-subject':
        nameDialog('rename-subject', id);
        break;
      case 'delete-subject':
        deleteSubject(id);
        break;
      case 'new-chapter':
        nameDialog('new-chapter', '', subject);
        break;
      case 'rename-chapter':
        nameDialog('rename-chapter', id, subject);
        break;
      case 'delete-chapter':
        deleteChapter(subject, id);
        break;
      case 'manage':
        manageDialog();
        break;
      case 'subject-menu':
        manageDialog(id);
        break;
      case 'course-questions':
      case 'open-subject':
        ui.subject = id;
        ui.chapter = '';
        ui.search = '';
        ui.pageIndex = 0;
        navigate('library');
        break;
      case 'open-chapter':
        ui.subject = subject; ui.chapter = chapter; ui.search = ''; ui.pageIndex = 0;
        navigate('library');
        break;
      case 'organize-current':
        manageDialog(ui.subject);
        break;
      case 'new-current-chapter':
        nameDialog('new-chapter', '', ui.subject);
        break;
      case 'revise-current':
        ui.prepSubject = ui.subject; ui.prepChapter = ''; ui.mode = 'classic';
        navigate('revise');
        break;
      case 'new-question':
        editQuestion();
        break;
      case 'edit-question':
        editQuestion(id);
        break;
      case 'delete-question': {
        const q = db.questions.find(q => q.id === id);
        if (q) askConfirm('Supprimer cette question ?',
          `La question « ${q.prompt.slice(0,150)}${q.prompt.length>150?'…':''} » et sa progression seront supprimées. L’historique est conservé.`,
          () => {
            removeQuestions([id]);
            save();
            render();
            toast('Question supprimée.');
          }, 'Supprimer');
        break;
      }
      case 'add-option':
        readEditor();
        if (editorDraft.options.length < 6) editorDraft.options.push({
          id: uid(),
          text: '',
          correct: false
        });
        renderEditor();
        break;
      case 'remove-option':
        readEditor();
        if (editorDraft.options.length > 2) editorDraft.options.splice(Number(button.dataset
          .index), 1);
        renderEditor();
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'confirm': {
        const op = pendingOperation;
        closeModal();
        op?.();
        break;
      }
      case 'page-next':
        ui.pageIndex++;
        render();
        break;
      case 'page-prev':
        ui.pageIndex = Math.max(0, ui.pageIndex - 1);
        render();
        break;
      case 'mode':
        if ($('#prep-count')) ui.count = Number($('#prep-count').value) || 10;
        if ($('#prep-minutes')) ui.minutes = Number($('#prep-minutes').value) || 15;
        ui.mode = button.dataset.mode;
        render();
        break;
      case 'quick-errors':
        ui.mode = totals().errors ? 'errors' : 'classic';
        ui.prepSubject = '';
        ui.prepChapter = '';
        navigate('revise');
        break;
      case 'revise-chapter':
        ui.prepSubject = subject;
        ui.prepChapter = chapter;
        ui.mode = 'classic';
        navigate('revise');
        break;
      case 'answer-option':
        selectOption(id);
        break;
      case 'validate-answer':
        validateAnswer();
        break;
      case 'next-question':
        nextQuestion();
        break;
      case 'pause':
        navigate('revise');
        toast('Votre session est conservée.' + (db.activeSession?.mode === 'exam' ?
          ' Le chronomètre continue.' : ''));
        break;
      case 'resume':
        if (!checkDeadline()) navigate('quiz');
        break;
      case 'abandon':
        askConfirm('Terminer cette session ?',
          'Vos réponses validées seront conservées dans l’historique. Les questions restantes compteront comme non répondues dans le score.',
          () => finishSession('abandoned'), 'Terminer la session');
        break;
      case 'session-detail':
        ui.resultId = id;
        navigate('result');
        break;
      case 'questions-select':
        $('#questions-file').click();
        break;
      case 'preview-import':
        previewImport();
        break;
      case 'confirm-import': {
        if (!ui.pendingImport) {
          toast('Vérifiez d’abord votre JSON.');
          break;
        }
        const p = importPlan(ui.pendingImport);
        db = p.candidate;
        ui.pendingImport = null;
        save();
        $('#export-subject').innerHTML = subjectOptions();
        $('#export-chapter').innerHTML = chapterOptions();
        $('#import-feedback').innerHTML =
          `<div class="notice" style="margin-top:16px"><b>Import terminé.</b> ${p.added} question(s) ajoutée(s), ${p.duplicates} doublon(s) ignoré(s). <button class="text-link" data-action="navigate" data-page="library">Ouvrir ma bibliothèque</button></div>`;
        toast('Questions importées.');
        break;
      }
      case 'export-questions': {
        const sid = $('#export-subject').value,
          cid = $('#export-chapter').value;
        downloadJSON('reviso-questions-' + dateKey(Date.now()) + '.json', exportQuestions(sid,
          cid));
        toast('Questions exportées au format JSON.');
        break;
      }
      case 'download-example':
        downloadJSON('reviso-exemple.json', JSON_EXAMPLE);
        break;
      case 'copy-example': {
        const content = JSON.stringify(JSON_EXAMPLE, null, 2);
        try {
          if (!navigator.clipboard?.writeText) throw new Error('clipboard');
          await navigator.clipboard.writeText(content);
          toast('Exemple JSON copié.');
        } catch (e) {
          const range = document.createRange();
          range.selectNodeContents($('#json-example'));
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          toast('Sélection prête : utilisez Ctrl+C pour copier.');
        }
        break;
      }
      case 'backup':
        downloadBackup();
        break;
      case 'restore-select':
        $('#restore-file').click();
        break;
      case 'download-app':
        downloadApp();
        break;
    }
  } catch (error) {
    toast('L’opération n’a pas pu être terminée : ' + error.message);
  }
});
document.addEventListener('submit', e => {
  const form = e.target;
  if (!['name-form', 'question-form', 'prepare-form'].includes(form.id)) return;
  e.preventDefault();
  if (form.id === 'prepare-form') {
    startQuiz();
    return;
  }
  if (form.id === 'name-form') {
    try {
      const kind = form.dataset.kind,
        id = form.dataset.id,
        sid = form.dataset.subject,
        name = textValue($('#entity-name').value, 'Le nom', 100),
        isSubject = kind.includes('subject'),
        list = isSubject ? db.subjects : (getSubject(sid)?.chapters || []);
      if (list.some(x => x.id !== id && normalizedName(x.name) === normalizedName(name))) fail(
        'Ce nom existe déjà ici. Choisissez un autre nom.');
      if (kind === 'new-subject') {
        if (db.subjects.length >= 500) fail('La limite de 500 matières est atteinte.');
        db.subjects.push({
          id: uid(),
          name,
          color: db.subjects.length % COLORS.length,
          chapters: [{
            id: uid(),
            name: 'Général'
          }]
        });
      } else if (kind === 'new-chapter') {
        const s = getSubject(sid);
        if (!s) fail('Matière introuvable.');
        if (s.chapters.length >= 2000) fail('La limite de chapitres est atteinte.');
        s.chapters.push({id: uid(), name, theme: $('#entity-theme')?.value.trim() || ''});
      } else if (kind === 'rename-subject') getSubject(id).name = name;
      else { getChapter(sid, id).name = name; getChapter(sid, id).theme = $('#entity-theme')?.value.trim() || ''; }
      save();
      closeModal();
      render();
      toast(kind.startsWith('new') ? 'Création enregistrée.' : 'Nouveau nom enregistré.');
    } catch (err) {
      $('#name-error').innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }
  if (form.id === 'question-form') {
    try {
      readEditor();
      const q = validateQuestion(editorDraft);
      if (!getChapter(q.subjectId, q.chapterId)) fail('Choisissez un chapitre valide.');
      const i = db.questions.findIndex(x => x.id === q.id);
      if (i === -1) {
        if (db.questions.length >= 50000) fail('La limite de 50 000 questions est atteinte.');
        db.questions.push(q);
      } else {
        const previous = db.questions[i];
        const materialChange = previous.prompt !== q.prompt || previous.type !== q.type || JSON
          .stringify(previous.options) !== JSON.stringify(q.options);
        db.questions[i] = q;
        if (materialChange) delete db.progress[q.id];
      }
      save();
      closeModal();
      render();
      toast('Question enregistrée.');
    } catch (err) {
      $('#question-error').innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  switch (t.id) {
    case 'course-subject':
      ui.subject = t.value; ui.chapter = ''; render();
      break;
    case 'library-subject':
      ui.subject = t.value;
      ui.chapter = '';
      ui.pageIndex = 0;
      render();
      break;
    case 'library-chapter':
      ui.chapter = t.value;
      ui.pageIndex = 0;
      render();
      break;
    case 'prep-subject':
      ui.count = Number($('#prep-count').value) || 10;
      ui.minutes = Number($('#prep-minutes')?.value || ui.minutes);
      ui.prepSubject = t.value;
      ui.prepChapter = '';
      render();
      break;
    case 'prep-chapter':
      ui.count = Number($('#prep-count').value) || 10;
      ui.minutes = Number($('#prep-minutes')?.value || ui.minutes);
      ui.prepChapter = t.value;
      render();
      break;
    case 'q-subject':
      readEditor();
      editorDraft.chapterId = getSubject(t.value)?.chapters[0]?.id || '';
      renderEditor();
      break;
    case 'q-type':
      readEditor();
      if (editorDraft.type === 'single') {
        let first = true;
        editorDraft.options.forEach(o => {
          if (o.correct) {
            o.correct = first;
            first = false;
          }
        });
      }
      renderEditor();
      break;
    case 'questions-file':
      try {
        const text = await readJSONFile(t.files[0]);
        if (text) {
          $('#import-text').value = text;
          previewImport();
        }
      } catch (err) {
        $('#import-feedback').innerHTML = `<div class="error">${esc(err.message)}</div>`;
      }
      t.value = '';
      break;
    case 'restore-file':
      await restoreFile(t.files[0]);
      break;
    case 'export-subject':
      $('#export-chapter').innerHTML = chapterOptions(t.value);
      break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') {
    const pos = e.target.selectionStart;
    ui.search = e.target.value;
    ui.pageIndex = 0;
    render();
    const input = $('#search');
    input.focus({
      preventScroll: true
    });
    input.setSelectionRange(pos, pos);
  }
  if (e.target.id === 'import-text') {
    ui.pendingImport = null;
    $('#import-feedback').innerHTML = '';
  }
});
document.addEventListener('keydown', e => {
  if (ui.page !== 'quiz' || !db.activeSession || $('#modal').open || e.target.closest(
      'input,textarea,select,[contenteditable=true]') || e.ctrlKey || e.metaKey || e.altKey)
    return;
  const a = db.activeSession,
    q = a.questions[a.currentIndex],
    n = Number(e.key);
  if (n >= 1 && n <= q.options.length && /^\d$/.test(e.key) && !a.answers[a.currentIndex]) {
    e.preventDefault();
    selectOption(q.options[n - 1].id);
  }
  if (e.key === 'Enter' && (!e.target.closest('button') || e.target.closest(
      '.answer,[data-action=validate-answer],[data-action=next-question]'))) {
    e.preventDefault();
    if (a.answers[a.currentIndex]) nextQuestion();
    else validateAnswer();
  }
});
$('#modal').addEventListener('cancel', () => {
  pendingOperation = null;
});
window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY && e.newValue !== lastStored) {
    storageLocked = true;
    storageProblem =
      'Les données ont changé dans un autre onglet. Rechargez cette page avant de continuer ; vous pouvez d’abord exporter vos données.';
    renderStorageAlert();
  }
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) tickTimer();
});


// ── main.js ──
/** Démarrage. Les banques sont installées de manière additive et une seule fois. */
const bundledUpdate = applyBundledCourses();
const defaultSubject = preferredCourseSubject();
if (defaultSubject) {
  ui.subject = defaultSubject.id;
  ui.prepSubject = defaultSubject.id;
}
render();
if ((!lastStored || bundledUpdate.changed) && !storageLocked) save();
if (bundledUpdate.added) toast(`${bundledUpdate.added} questions ajoutées aux cours.`);
checkDeadline();
setInterval(tickTimer, 500);

})();
</script>
</body>
