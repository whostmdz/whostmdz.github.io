<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/mraw.gif">
  <title>Veille Informatique – whostmdz</title>
  <style>

    /* Toolbar: search + count + refresh, assez sympa j'ai trouve certains composants pour faire ça*/
    .veille-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .veille-search {
      flex: 1 1 240px;
      background: transparent;
      border: 1px solid var(--theme-color);
      border-radius: 6px;
      padding: 10px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--theme-text-color);
      outline: none;
      transition: box-shadow 0.3s;
    }
    .veille-search::placeholder { color: var(--muted); }
    .veille-search:focus { box-shadow: 0 0 0 2px var(--theme-color); }

    /* compter  */
    .count-select {
      background: transparent;
      border: 1px solid var(--theme-color);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--theme-text-color);
      cursor: pointer;
      outline: none;
      transition: all 0.3s;
      background-color: var(--theme-background);
    }
    .count-select:hover,
    .count-select:focus { box-shadow: 0 0 0 2px var(--theme-color); }
    .count-select option { background: var(--theme-background); color: var(--theme-text-color); }

    .refresh-btn {
      background: transparent;
      color: var(--theme-text-color);
      border: 1px solid var(--theme-color);
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .refresh-btn:hover { background: var(--theme-color); color: var(--theme-background); }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* pour filtrer */
    .cat-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 2px solid var(--theme-surface);
    }
    .cat-btn {
      background: transparent;
      border: 1px solid var(--theme-color);
      border-radius: 6px;
      padding: 7px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 0.88rem;
      color: var(--theme-color);
      cursor: pointer;
      transition: all 0.25s;
    }
    .cat-btn:hover { background: var(--theme-surface); transform: translateY(-2px); }
    .cat-btn.active { background: var(--theme-color); color: var(--theme-background); font-weight: bold; }

    #fallback-banner {
      display: none;
      align-items: center;
      gap: 12px;
      background: var(--theme-surface);
      border: 1px dashed var(--theme-color);
      border-radius: 6px;
      padding: 12px 18px;
      margin-bottom: 24px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    #fallback-banner strong { color: var(--theme-color); }

    .veille-status {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .veille-status .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--theme-color);
      flex-shrink: 0;
      animation: blink 1.6s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    #feed-list { display: flex; flex-direction: column; }

    .feed-entry {
      display: grid;
      grid-template-columns: 130px 100px 1fr auto;
      align-items: baseline;
      gap: 0 14px;
      padding: 11px 6px;
      border-bottom: 1px solid var(--theme-surface);
      transition: background 0.18s, padding-left 0.18s;
      animation: fadeIn 0.3s ease forwards;
      opacity: 0;
    }
    .feed-entry:hover { background: var(--theme-surface); padding-left: 12px; border-radius: 4px; }
    .feed-entry.is-fallback { opacity: 0.7; }

    @keyframes fadeIn { to { opacity: 1; } }

    .entry-date {
      font-size: 0.78rem;
      color: var(--theme-color);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .entry-source {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-title a {
      color: var(--theme-text-color);
      text-decoration: none;
      font-size: 0.93rem;
      line-height: 1.45;
      transition: color 0.2s;
    }
    .entry-title a:hover { color: var(--theme-color); }
    .entry-cat {
      font-size: 0.72rem;
      border: 1px dashed var(--theme-color);
      color: var(--theme-color);
      border-radius: 4px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, var(--theme-surface) 25%, color-mix(in hsl, var(--theme-color) 30%, transparent) 50%, var(--theme-surface) 75%);
      background-size: 200% 100%;
      border-radius: 3px;
      animation: shimmer 1.3s infinite;
      margin-bottom: 13px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .feed-empty {
      color: var(--muted);
      font-style: italic;
      padding: 40px 0;
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .feed-entry {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        row-gap: 4px;
        column-gap: 10px;
      }
      .entry-date { order: 2; font-size: 0.72rem; text-align: right; align-self: start; }
      .entry-source { display: none; }
      .entry-title { order: 1; grid-column: 1 / -1; }
      .entry-cat { order: 3; font-size: 0.68rem; }
      .veille-toolbar { flex-direction: column; align-items: stretch; }
      .count-select, .refresh-btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="blob"></div>
  <button id="theme-toggle" aria-label="Basculer le thème"></button>

  <header>
    <a href="../index.html">
      <img src="../assets/logo.png" alt="Logo whostmdz" class="site-logo">
    </a>
    <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="nav-menu">
      <ul>
        <li><a href="projets.html">projets</a></li>
        <li><a href="veille.html">veille</a></li>
        <li><a href="contact.html">contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-page">
    <div class="page-container">

      <div class="page-header">
        <h1>Veille Informatique</h1>
        <p>Flux RSS agrégé — sécurité, reverse/pwn, Linux, dev, actu tech.</p>
      </div>

      <div class="veille-toolbar">
        <input
          type="search"
          id="veille-search"
          class="veille-search"
          placeholder="$ grep -i 'mot-clé' flux..."
          autocomplete="off"
          spellcheck="false"
        >
        <select id="article-count" class="count-select" title="Nombre d'articles à afficher">
          <option value="20">20 articles</option>
          <option value="40" selected>40 articles</option>
          <option value="60">60 articles</option>
          <option value="80">80 articles</option>
          <option value="9999">Tous</option>
        </select>
        <button id="refresh-feed" class="refresh-btn">↻ Actualiser</button>
      </div>

      <div class="cat-filter" id="cat-filter">
        <button class="cat-btn active" data-cat="all">Tous</button>
        <button class="cat-btn" data-cat="Sécurité">Sécurité</button>
        <button class="cat-btn" data-cat="Reverse / Pwn">Reverse / Pwn</button>
        <button class="cat-btn" data-cat="Linux / Bash">Linux / Bash</button>
        <button class="cat-btn" data-cat="Dev / Java / C">Dev / Java / C</button>
        <button class="cat-btn" data-cat="Actu Tech">Actu Tech</button>
      </div>
      <div id="fallback-banner">
        <span>⚠</span>
        <span>Flux RSS indisponibles — <strong>mode hors-ligne</strong> : articles de référence affichés. Réessaie avec ↻ Actualiser.</span>
      </div>
      <div class="veille-status">
        <span class="dot"></span>
        <span id="status-text">Chargement des flux…</span>
      </div>

      <div id="feed-list"></div>

    </div>
  </main>

  <footer>
    <p>design with &lt;3 - whostmdz</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/veille-rss.js"></script>
</body>
</html>
